name: new-deploy
on:
  workflow_dispatch:
env:
  BRANCH: master
# contents: push the empty commit, actions: dispatch the deploy workflow (no PAT to expire)
permissions:
  contents: write
  actions: write
jobs:
  new-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          persist-credentials: false
      - name: Push to master empty commit
        run: |
          git config --local user.email "ci@monadical.com"
          git config --local user.name "CI monadical.com"
          git commit --allow-empty -m "Redeployed by git hub actions"
      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ env.BRANCH }}
      - name: Trigger deploy
        # Pushes made with GITHUB_TOKEN don't fire other workflows, so start the deploy explicitly.
        # It checks out the new "Redeployed" HEAD, so its autodeploy skip check passes and it rebuilds.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref ${{ env.BRANCH }}
